[tool.poetry]
name = "agent-customer-support"
version = "0.1.0"
description = "Cloud advisory AI agent for CenLab customer support"
authors = ["Tam Duc <dev@tamducjsc.info>"]
packages = [{ include = "agent_customer_support" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
pydantic = "^2.9"
pydantic-settings = "^2.6"
aioboto3 = "^13.2"
redis = "^5.2"
httpx = ">=0.27"
anthropic = "^0.107.1"
tiktoken = "^0.13.0"
google-genai = "^2.8.0"
openai = "^2.41.0"
environs = "^15.0.1"
tenacity = "^9.1.4"
openpyxl = "^3.1.5"
langfuse = "^4.7.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
respx = "^0.21"
fakeredis = "^2.26"
ruff = "^0.9"
mypy = "^1.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
